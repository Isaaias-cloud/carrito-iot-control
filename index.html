<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="Panel de control dual para el vehículo IoT" />
    <title>Control · Vehículo IoT</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="gamepad-body">
    <a class="skip-link" href="#main-content">Saltar al contenido</a>

    <div class="gamepad-wrapper">
      <!-- Barra superior compacta -->
      <header class="gamepad-header">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">⌁</span>
          <div>
            <h1 class="app-title" id="vehicle-name">Excavadora IoT</h1>
            <p class="eyebrow mb-0">ID: <strong id="vehicle-id">1</strong></p>
          </div>
        </div>

        <div class="status-strip" aria-label="Estado del sistema">
          <span class="status-pill status-pill--checking" id="status-ws-pill" title="WebSocket">WSS</span>
          <span class="status-pill status-pill--checking" id="status-api-pill" title="API REST">API</span>
          <span class="status-pill status-pill--unknown" id="status-rds-pill" title="Base de datos RDS">RDS</span>
        </div>
      </header>

      <!-- Panel del Gamepad / Consola -->
      <main id="main-content" class="gamepad-shell" tabindex="-1">
        
        <!-- Joystick Izquierdo: Chasis / Desplazamiento -->
        <section class="joystick-zone joystick-zone--left" aria-labelledby="left-joystick-title">
          <h2 id="left-joystick-title" class="zone-title">MOVIMIENTO</h2>
          <div
            class="joystick"
            id="joystick-left"
            role="application"
            tabindex="0"
            aria-label="Joystick de desplazamiento. Usar W A S D o Flechas."
          >
            <div class="joystick-ring" aria-hidden="true">
              <span class="joystick-axis joystick-axis--horizontal"></span>
              <span class="joystick-axis joystick-axis--vertical"></span>
              <span class="joystick-knob" id="joystick-knob-left"></span>
              <span class="joystick-arrow joystick-arrow--up">↑</span>
              <span class="joystick-arrow joystick-arrow--right">→</span>
              <span class="joystick-arrow joystick-arrow--down">↓</span>
              <span class="joystick-arrow joystick-arrow--left">←</span>
            </div>
          </div>
          <span class="joystick-readout" id="left-direction-readout" aria-live="polite">Neutral</span>
        </section>

        <!-- Panel Central: Acciones principales estilo PS4 -->
        <section class="center-zone" aria-label="Botones de acción central">
          <div class="center-actions-grid">
            <button class="btn-gamepad btn-gamepad--sound" id="btn-sound" type="button" aria-label="Activar ruido o claxon">
              <span class="btn-icon" aria-hidden="true">🔊</span>
              <span class="btn-label">Ruido</span>
            </button>

            <button class="btn-gamepad btn-gamepad--speed" id="btn-speed" type="button" aria-label="Cambiar velocidad">
              <span class="btn-icon" aria-hidden="true">⚡</span>
              <span class="btn-label">Velocidad</span>
            </button>

            <button class="btn-gamepad btn-gamepad--light" id="btn-light" type="button" aria-label="Encender o apagar luz">
              <span class="btn-icon" aria-hidden="true">💡</span>
              <span class="btn-label">Luz</span>
            </button>

            <button class="btn-gamepad btn-gamepad--off" id="btn-off" type="button" aria-label="Apagar vehículo">
              <span class="btn-icon" aria-hidden="true">⏻</span>
              <span class="btn-label">Apagar</span>
            </button>
          </div>

          <!-- Botón de Paro General (Centro inferior) -->
          <button class="stop-button" id="stop-button" type="button" aria-label="Solicitar detener inmediatamente">
            <span class="stop-button__icon" aria-hidden="true">■</span>
            <span class="stop-button__label">DETENER</span>
          </button>
        </section>

        <!-- Joystick Derecho: Control de Pala / Brazo -->
        <section class="joystick-zone joystick-zone--right" aria-labelledby="right-joystick-title">
          <h2 id="right-joystick-title" class="zone-title">PALA / CÁMARA</h2>
          <div
            class="joystick"
            id="joystick-right"
            role="application"
            tabindex="0"
            aria-label="Joystick de pala. Arriba/Abajo inclinación, Izquierda/Derecha giro."
          >
            <div class="joystick-ring" aria-hidden="true">
              <span class="joystick-axis joystick-axis--horizontal"></span>
              <span class="joystick-axis joystick-axis--vertical"></span>
              <span class="joystick-knob" id="joystick-knob-right"></span>
              <span class="joystick-arrow joystick-arrow--up">▲</span>
              <span class="joystick-arrow joystick-arrow--right">►</span>
              <span class="joystick-arrow joystick-arrow--down">▼</span>
              <span class="joystick-arrow joystick-arrow--left">◄</span>
            </div>
          </div>
          <span class="joystick-readout" id="right-direction-readout" aria-live="polite">Neutral</span>
        </section>

      </main>

      <!-- Barra inferior compacta de Telemetría -->
      <footer class="gamepad-footer">
        <div class="telemetry-compact" aria-live="polite">
          <span class="telemetry-label">Último WSS:</span>
          <span class="telemetry-value" id="event-content">Escuchando eventos...</span>
        </div>
        <div class="student-credit">
          <span id="student-name">Isaaias Arrieta Prado</span>
        </div>
      </footer>
    </div>

    <!-- Región de notificaciones / mensajes emergentes -->
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
